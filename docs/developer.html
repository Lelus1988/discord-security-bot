<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Developer — Private Security-Bot</title>
<meta name="description" content="Über den Entwickler des Private Security-Bot.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c10;
    --surface: #14171c;
    --glass: rgba(23, 27, 34, 0.55);
    --glass-strong: rgba(23, 27, 34, 0.72);
    --glass-border: rgba(255, 255, 255, 0.07);
    --border: #262b33;
    --accent: #68818f;
    --accent-bright: #9db7c3;
    --text: #e6e9ec;
    --text-muted: #8b929b;
    --success: #7fae8e;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --sans: 'Inter', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  body{
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
  }

  a{ color: var(--accent-bright); }

  :focus-visible{
    outline: 2px solid var(--accent-bright);
    outline-offset: 2px;
  }

  .bg-glow{ position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
  .glow{ position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.45; will-change: transform; }
  .glow-1{ width: 620px; height: 620px; top: -220px; left: -180px; background: radial-gradient(circle at 35% 35%, #3d6d92, transparent 70%); animation: drift1 30s ease-in-out infinite; }
  .glow-2{ width: 560px; height: 560px; bottom: -260px; right: -180px; background: radial-gradient(circle at 60% 40%, #2e4a63, transparent 70%); animation: drift2 36s ease-in-out infinite; }
  @keyframes drift1{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(40px, 30px); } }
  @keyframes drift2{ 0%,100%{ transform: translate(0,0); } 50%{ transform: translate(-30px, -30px); } }
  @media (prefers-reduced-motion: reduce){ .glow{ animation: none !important; } }
  @media (max-width: 720px){ .glow{ filter: blur(80px); opacity: 0.35; } }

  header.nav{
    position: sticky; top: 0; z-index: 50;
    background: rgba(10,12,16,0.6);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--glass-border);
  }
  .nav-inner{ display:flex; align-items:center; justify-content:space-between; padding: 14px 24px; max-width: 1040px; margin:0 auto; }
  .brand{ font-family: var(--mono); font-weight:700; letter-spacing: 0.02em; color: var(--text); text-decoration:none; font-size: 15px; display:flex; align-items:center; gap:8px; }
  .brand .dot{ width:8px; height:8px; border-radius:50%; background: var(--success); box-shadow: 0 0 0 3px rgba(127,174,142,0.15); }
  nav.links{ display:flex; gap: 22px; font-family: var(--mono); font-size: 13px; }
  nav.links a{ color: var(--text-muted); text-decoration:none; }
  nav.links a:hover, nav.links a[aria-current="page"]{ color: var(--text); }
  @media (max-width: 720px){ nav.links{ display:none; } }

  main{
    flex: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 90px 24px 100px;
  }

  .section-head{ text-align:center; margin-bottom: 44px; }
  .section-num{ font-family: var(--mono); color: var(--text-muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
  h1{ font-family: var(--mono); font-size: clamp(26px, 4vw, 34px); margin: 0 0 12px; letter-spacing: -0.01em; }
  .section-desc{ color: var(--text-muted); max-width: 440px; margin: 0 auto; font-size: 15px; }

  .card{
    background: var(--glass);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 44px 36px;
    text-align: center;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.7);
    transition: border-color 0.2s, transform 0.2s;
  }
  .card:hover{ border-color: var(--accent); transform: translateY(-3px); }

  .avatar-ring{
    width: 112px; height: 112px;
    margin: 0 auto 22px;
    border-radius: 50%;
    padding: 3px;
    background: conic-gradient(from 140deg, var(--accent-bright), var(--accent), #3d6d92, var(--accent-bright));
  }
  .avatar-ring img{
    width: 100%; height: 100%;
    border-radius: 50%;
    display: block;
    object-fit: cover;
    border: 3px solid var(--bg);
  }

  .card h2{ font-family: var(--mono); font-size: 21px; margin: 0 0 4px; }
  .handle{ font-family: var(--mono); font-size: 13px; color: var(--text-muted); margin: 0 0 20px; }

  .pills{ display:flex; flex-wrap:wrap; gap: 8px; justify-content: center; margin-bottom: 28px; }
  .pill{
    font-family: var(--mono); font-size: 12px; color: var(--text-muted);
    border: 1px solid var(--border); background: rgba(255,255,255,0.02);
    padding: 6px 12px; border-radius: 20px;
  }

  .divider{ height: 1px; background: var(--glass-border); margin: 0 auto 24px; width: 60%; }

  .socials{ display:flex; justify-content:center; gap: 14px; }
  .social-btn{
    width: 44px; height: 44px; border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--border);
    color: var(--text-muted);
    text-decoration:none;
    transition: 0.2s;
  }
  .social-btn:hover{ border-color: var(--accent); color: var(--accent-bright); transform: translateY(-2px); }
  .social-btn svg{ width: 19px; height: 19px; }

  .back-row{ text-align:center; margin-top: 40px; }
  .btn{ font-family: var(--mono); font-size: 13px; padding: 10px 16px; border-radius: 6px; text-decoration:none; border: 1px solid var(--border); color: var(--text); }
  .btn:hover{ border-color: var(--accent); color: var(--accent-bright); }

  footer{ padding: 0 0 50px; text-align:center; color: var(--text-muted); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

  <div class="back-row">
